<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generative AI Application Development – Brahma AI | Mamta</title>
<style>
:root{--bg:#e6ebf7;--fg:#1b2a5c;--bar:#fff;--navy:#1b2a5c;--red:#e63b1f;--blue:#2f6bee;--yel:#f7c948;--grn:#1f9d6b;--pur:#7a4cd6;--lt:#eef2fb;--mut:#5b6b8c;--tx:#1a1f36;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1226;--fg:#cadcfc;--bar:#1b2a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1226;--fg:#cadcfc;--bar:#1b2a5c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Calibri,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
#stage{width:1280px;height:720px;position:relative;flex:none;transform-origin:center center;box-shadow:0 6px 30px rgba(0,0,0,.25);border-radius:6px;overflow:hidden;background:#fff}
.s{position:absolute;inset:0;background:#fff;color:var(--tx);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;transform:translateX(30px)}
.s.on{opacity:1;pointer-events:auto;transform:none}
.s.dk{background:var(--navy);color:#fff}
.hd{position:absolute;left:56px;top:22px;right:56px;display:flex;align-items:center;gap:14px}
.hd img{height:58px}
.hd b{font:700 19px Cambria,Georgia,serif;color:var(--navy);display:block}
.hd small{font-size:13px;color:var(--mut)}
.hd em{margin-left:auto;font-style:normal;font-size:14px;color:var(--mut)}
h2{position:absolute;left:56px;top:96px;margin:0;font:700 42px Cambria,Georgia,serif;color:var(--navy)}
.b{position:absolute;left:56px;right:56px;top:176px;bottom:44px}
.pg{position:absolute;right:30px;bottom:12px;font-size:13px;color:var(--mut)}
.g{display:grid;gap:20px;height:100%}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.c{background:var(--lt);border-radius:14px;padding:22px 24px}
.c h3{margin:0 0 8px;font:700 22px Cambria,Georgia,serif;color:var(--navy)}
.c p{margin:0;font-size:19px;line-height:1.35}
.n{display:inline-flex;width:40px;height:40px;border-radius:50%;color:#fff;font:700 19px Cambria,serif;align-items:center;justify-content:center;margin-bottom:12px}
.cr{display:flex;align-items:center;gap:14px}.cr .n{margin:0;flex:none}.cr h3{margin:0}
ul{margin:0;padding-left:22px;font-size:20px;line-height:1.5}li{margin-bottom:8px}
.hh{border-radius:10px;padding:12px;text-align:center;font:700 22px Cambria,serif;color:#fff;margin-bottom:16px}
.fl{display:flex;align-items:stretch;gap:0}
.fl div{flex:1;border-radius:10px;color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 8px;min-height:88px}
.fl span{flex:none;width:30px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--mut)}
.st{font:700 48px Cambria,serif}.sl{font-size:18px}
table{border-collapse:collapse;width:100%;font-size:18px}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 14px}
td{padding:10px 14px;border:1px solid #d5dcec}tr:nth-child(even) td{background:var(--lt)}
code{font-family:"Courier New",monospace;font-size:16px}
.chip{display:inline-block;border-radius:10px;padding:12px 18px;color:#fff;font-weight:700;font-size:19px;margin:0 10px 12px 0}
.bar{min-width:130px;height:26px;border-radius:5px;margin:4px 0;color:#fff;font-size:15px;line-height:26px;padding-left:8px;white-space:nowrap;transition:width 1s}
.btn{display:inline-block;background:var(--yel);color:var(--navy);font-weight:700;font-size:20px;padding:14px 26px;border-radius:30px;text-decoration:none}
.btn:hover{background:#fff}
#nav{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 12px;background:var(--bar);color:var(--fg);font-size:15px}
#nav button{border:0;background:var(--red);color:#fff;font-size:16px;font-weight:700;border-radius:20px;padding:8px 20px;cursor:pointer}
#nav button:disabled{opacity:.4;cursor:default}
#nav a{color:var(--fg);font-weight:700}
</style>
</head>

const st=document.getElementById("stage");st.innerHTML=slides.join("");
const el=[...st.children];el.forEach((e,i)=>{if(!e.classList.contains("dk")||i>0&&i<15){const p=document.createElement("div");p.className="pg";p.textContent=i+1;if(!e.classList.contains("dk"))e.appendChild(p)}});
let cur=0;const pv=document.getElementById("pv"),nx=document.getElementById("nx"),ct=document.getElementById("ct");
function go(n){cur=Math.max(0,Math.min(el.length-1,n));el.forEach((e,i)=>e.classList.toggle("on",i==cur));ct.textContent=(cur+1)+" / "+el.length;pv.disabled=cur==0;nx.disabled=cur==el.length-1}
function fit(){const w=document.getElementById("wrap");const k=Math.min((w.clientWidth-16)/1280,(w.clientHeight-16)/720);st.style.transform="scale("+k+")";st.style.margin=(-(720*(1-k))/2)+"px "+(-(1280*(1-k))/2)+"px"}
pv.onclick=()=>go(cur-1);nx.onclick=()=>go(cur+1);
addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(cur+1)}else if(["ArrowLeft","PageUp"].includes(e.key))go(cur-1)});
let tx=null;st.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});st.addEventListener("touchend",e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(cur+(d<0?1:-1));tx=null},{passive:true});
addEventListener("resize",fit);fit();go(0);
